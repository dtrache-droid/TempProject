name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppLauncher.exe
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: AppLauncher
          path: bin/AppLauncher.exe

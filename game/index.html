<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1410">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>The Last Letter West</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;height:100%;background:#120d09;color:#f0e4cc;font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#1b1410}
#cv{width:100%;aspect-ratio:16/9;image-rendering:pixelated;display:block;background:#000;flex:none;touch-action:none}
#hud{flex:none;padding:6px 8px 2px;font:600 12px/1.2 system-ui,sans-serif}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:#2c2118;border:1px solid #4a3a2a;border-radius:8px;padding:3px 7px;white-space:nowrap}
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:5px;margin-top:5px}
.mem{background:#2c2118;border:1px solid #4a3a2a;border-radius:8px;padding:3px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem.dead{opacity:.4;text-decoration:line-through}
.bar{height:5px;background:#120d09;border-radius:3px;margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%}
#side{flex:1;min-height:0;display:flex;flex-direction:column}
#panel{position:relative}
.ev{position:absolute;left:10px;right:10px;top:6px;bottom:10px;display:flex;flex-direction:column;min-height:0}
.evt{flex:1 1 auto;min-height:56px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.evc{flex:0 0 auto;max-height:88%;overflow:auto;padding-top:2px;overscroll-behavior:contain}
#panel{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 10px 18px;-webkit-overflow-scrolling:touch}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
h2,.story,.tags,.big{animation:fi .25s ease-out}
.hint{font:12px/1.35 system-ui,sans-serif;color:#9d8a66;margin:2px 2px 4px}
.chip.warn{border-color:#d9534f;color:#ffab9c}
button.link{background:none;border:0;color:#9d8a66;font:600 12px system-ui,sans-serif;min-height:36px;padding:6px;margin-top:6px;text-decoration:underline}
#hud.compact .r2,#hud.compact .party,#hud.res .party,#hud.res .r1{display:none}
.evt.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 26px),transparent);mask-image:linear-gradient(#000 calc(100% - 26px),transparent)}
.big.sm{min-height:38px;padding:7px 12px;margin:3px 0}
.route{position:relative;height:22px;margin:2px 4px 6px}
.route:before{content:'';position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:#3a2c1f}
.route i{position:absolute;top:6px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:#3a2c1f;border:2px solid #6b4a2e}
.route i.v{background:#c88a3a;border-color:#f0b860}
.route b{position:absolute;top:-2px;width:0;height:0;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #ffd27a;filter:drop-shadow(0 1px 0 #000)}
@media (orientation:landscape) and (max-height:560px){#app{max-width:none;flex-direction:row}#cv{width:min(58vw,calc(100vh * 16 / 9));height:auto;align-self:flex-start;flex:none}#side{height:100vh;height:100dvh;min-width:0}}
button{font:600 14px system-ui,sans-serif;color:#f6ead2;background:linear-gradient(#6b4a2e,#4a3220);border:1px solid #8a6540;border-radius:10px;padding:10px 8px;min-height:44px;cursor:pointer}
button:active{transform:translateY(1px);filter:brightness(1.2)}
button.on{background:linear-gradient(#c88a3a,#92601f);border-color:#f0b860;color:#fff}
button:disabled{opacity:.4}
.big{width:100%;margin:4px 0;text-align:left;padding:10px 12px;min-height:42px;line-height:1.3;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0}
.lbl{font:700 11px system-ui,sans-serif;color:#c9b38a;text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
h1{font:700 26px/1.1 'Courier New',monospace;color:#f2c571;letter-spacing:.04em;margin:4px 0 8px;text-shadow:2px 2px 0 #5a3414}
h2{margin:4px 0 6px;font:700 17px 'Courier New',monospace;color:#f2c571;letter-spacing:.02em}
.story{white-space:pre-wrap;font-size:15px;line-height:1.45;min-height:56px}
.story.letter{font-style:italic;background:#e9dcbc;color:#3a2a18;padding:12px;border-radius:6px;border:1px solid #b79c6a}
.tags{margin:10px 0 4px;display:flex;flex-wrap:wrap;gap:6px;font:700 12px system-ui,sans-serif}
.tags b{background:#2c2118;border:1px solid #4a3a2a;border-radius:8px;padding:3px 8px}
.up{color:#8fe07a}.dn{color:#ff8f7a}
.msg{margin-top:10px;font:13px/1.45 system-ui,sans-serif;color:#cdbb97}
.msg div{padding:2px 0;border-bottom:1px solid #2c2118}
.msg div:first-child{color:#f6ead2}
.fine{font:12px/1.4 system-ui,sans-serif;color:#9d8a66;margin-top:10px}
.small{font:700 12px 'Courier New',monospace;color:#c9b38a;letter-spacing:.3em}
input{width:100%;font:600 18px Georgia,serif;padding:10px;border-radius:10px;border:1px solid #8a6540;background:#2c2118;color:#f6ead2;-webkit-user-select:text;user-select:text}
.jr{font:14px/1.45 Georgia,serif;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid #2c2118}
.jr small{display:block;color:#c9b38a;font:700 11px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.hunt{font:700 16px system-ui,sans-serif;display:flex;justify-content:space-between;gap:8px;margin:6px 0}
.hunt span{background:#2c2118;border:1px solid #4a3a2a;border-radius:8px;padding:6px 10px}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="320" height="180"></canvas>
  <div id="side"><div id="hud"></div><div id="panel"></div></div>
</div>
<noscript>This game needs JavaScript.</noscript>
<script>
'use strict';
/* =====================================================================
   THE LAST LETTER WEST  -  a small offline trail game
   ===================================================================== */
const W=320,H=180,HZ=98,PXM=24,DEADLINE=175;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[ri(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const noise=x=>{const i=Math.floor(x),f=x-i,s=f*f*(3-2*f);return lerp(hash(i),hash(i+1),s)};
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ---------- world data ---------- */
const SKY=[[0,'#070b1f','#161a3d'],[.19,'#1a2050','#6b4468'],[.26,'#4a70a8','#f4a95c'],[.38,'#4f93da','#c3e3f6'],[.55,'#3f82d4','#aed6f2'],[.70,'#4a7bbb','#f2c97c'],[.77,'#5b4a8c','#f3794a'],[.85,'#1f2056','#6c3b6b'],[1,'#070b1f','#161a3d']].map(k=>[k[0],hex(k[1]),hex(k[2])]);
function skyAt(t){for(let i=1;i<SKY.length;i++){if(t<=SKY[i][0]){const a=SKY[i-1],b=SKY[i],u=(t-a[0])/(b[0]-a[0]);return[mix(a[1],b[1],u),mix(a[2],b[2],u)]}}return[SKY[0][1],SKY[0][2]]}

const BIOMES=[
 {to:250,name:'Prairie',ground:'#5f8c3a',road:'#a58d5c',far:'#8aa0b4',mid:'#5f8a4a',amp:10,props:['tree','bush','bush','tuft']},
 {to:530,name:'High Plains',ground:'#b2a05a',road:'#c4ad78',far:'#a9a9a2',mid:'#a89a58',amp:8,props:['rock','yucca','bush','tuft']},
 {to:780,name:'Badlands',ground:'#a67e56',road:'#c29c72',far:'#b0805f',mid:'#9a6c4c',amp:26,props:['rock','rock','yucca','pine']},
 {to:1040,name:'The Rockies',ground:'#7d8a6c',road:'#a9a487',far:'#8794a6',mid:'#566f58',amp:42,props:['pine','pine','rock','pine'],snow:true},
 {to:99999,name:'Blue Mountains',ground:'#3d6a3e',road:'#7f8a5c',far:'#587a86',mid:'#2d5a46',amp:30,props:['pine','pine','pine','fern']}
].map(b=>Object.assign({},b,{g:hex(b.ground),r:hex(b.road),f:hex(b.far),m:hex(b.mid)}));
function biome(m){
  const i=BIOMES.findIndex(b=>m<b.to),b=BIOMES[i<0?BIOMES.length-1:i],nb=BIOMES[i+1];
  if(nb&&b.to-m<40){const u=1-(b.to-m)/40;return Object.assign({},b,{g:mix(b.g,nb.g,u),r:mix(b.r,nb.r,u),f:mix(b.f,nb.f,u),m:mix(b.m,nb.m,u),amp:lerp(b.amp,nb.amp,u),props:u>.5?nb.props:b.props,snow:u>.5?nb.snow:b.snow})}
  return b;
}
const LM=[
 {m:0,name:'Independence, Missouri',type:'town'},
 {m:120,name:'Kansas River',type:'river'},
 {m:260,name:'Fort Kearny',type:'fort'},
 {m:400,name:'Chimney Rock',type:'rock'},
 {m:540,name:'Fort Laramie',type:'fort'},
 {m:680,name:'Independence Rock',type:'boulder'},
 {m:790,name:'South Pass',type:'pass'},
 {m:920,name:'Fort Hall',type:'fort'},
 {m:985,name:'Snake River',type:'river'},
 {m:1060,name:'Blue Mountains',type:'forest'},
 {m:1200,name:'Dry Creek Mill',type:'mill'}
];

/* ---------- state ---------- */
function blank(){return{name:'Ada',day:0,miles:0,food:450,money:250,parts:1,ammo:20,morale:70,pace:2,ration:2,lm:0,clues:0,f:{},journal:[],log:[],over:false,
 party:[{n:'Ada',role:'you',hp:100},{n:'Mara',role:'Elias’s wife',hp:100},{n:'Tobias',role:'Elias’s son',hp:100},{n:'Hollis',role:'teamster',hp:100}]}}
let G=blank(),mode='title',Q=[],cur=null,paused=false;
let tod=.3,todT=null,camp=false,tsec=0,speedNow=0,dayAcc=0,weather='clear',snowCover=0,flash=0;
let dust=[],sparks=[],birds=[],floats=[],pings=[],hunt=null,typing=null,lastT=0;
const clouds=Array.from({length:7},(_,i)=>({x:hash(i)*W,y:6+hash(i+7)*40,s:.6+hash(i+3)*.9,v:2+hash(i+5)*4}));
const wp=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,v:Math.random()}));
const alive=()=>G.party.filter(p=>!p.dead&&!p.left);
const member=n=>G.party.find(p=>p.n===n&&!p.left);
const dayMiles=()=>[0,10,15,20][G.pace];
function dateStr(short){const d=new Date(1848,3,20+G.day);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(short?'':', 1848')}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function jr(t){G.journal.push({d:dateStr(),t:t})}
function msg(t){G.log.push(t);if(G.log.length>5)G.log.shift();showMsg()}
function showMsg(){const m=$('msg');if(m)m.innerHTML=G.log.slice().reverse().map(x=>'<div>'+x+'</div>').join('')}
function clue(t){G.clues++;jr('CLUE: '+t)}

/* ---------- save ---------- */
function save(){try{localStorage.setItem('llw1',JSON.stringify({G:G,weather:weather,tod:tod}))}catch(e){}}
function hasSave(){try{return !!localStorage.getItem('llw1')}catch(e){return false}}
function load(){try{const s=JSON.parse(localStorage.getItem('llw1'));G=s.G;weather=s.weather||'clear';tod=s.tod||.3;return true}catch(e){return false}}

/* =====================================================================
   RENDERING
   ===================================================================== */
function ridge(base,amp,freq,speed,col,snow,wx){
  const off=wx*speed;ctx.fillStyle=col;
  for(let x=0;x<W;x+=2){
    const n=noise((x+off)/freq)*.7+noise((x+off)/(freq*.37)+50)*.3,h=n*amp,y=base-h;
    ctx.fillRect(x,y,2,HZ-y+1);
  }
  if(snow){ctx.fillStyle='#e8eef4';for(let x=0;x<W;x+=2){const n=noise((x+off)/freq)*.7+noise((x+off)/(freq*.37)+50)*.3;if(n>.6){const h=n*amp;ctx.fillRect(x,base-h,2,Math.min(6,(n-.6)*amp*.7+1))}}}
}
function prop(type,x,y,s,b){
  if(x<-30||x>W+30)return;const c=ctx;
  switch(type){
  case'tree':c.fillStyle='#4a3320';c.fillRect(x-s,y-9*s,2*s,9*s);c.fillStyle=rgb(mix(b.m,[20,60,20],.5));c.fillRect(x-6*s,y-18*s,12*s,6*s);c.fillRect(x-8*s,y-14*s,16*s,6*s);c.fillStyle=rgb(mix(b.m,[90,140,60],.4));c.fillRect(x-4*s,y-19*s,6*s,3*s);break;
  case'pine':c.fillStyle='#3b2a1a';c.fillRect(x-s,y-6*s,2*s,6*s);for(let k=0;k<5;k++){const w=(k+1)*3*s,yy=y-6*s-(5-k)*4*s;c.fillStyle=(b.snow&&k<3)?'#dfe8ee':rgb(mix(b.m,[10,50,40],.5));c.fillRect(x-w/2,yy,w,4.5*s)}break;
  case'rock':c.fillStyle=rgb(mix(b.g,[90,90,90],.6));c.beginPath();c.moveTo(x-7*s,y);c.lineTo(x-5*s,y-5*s);c.lineTo(x,y-8*s);c.lineTo(x+5*s,y-5*s);c.lineTo(x+8*s,y);c.fill();c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x-3*s,y-7*s,5*s,2*s);break;
  case'bush':c.fillStyle=rgb(mix(b.m,[40,90,40],.5));c.fillRect(x-5*s,y-4*s,10*s,4*s);c.fillRect(x-3*s,y-6*s,6*s,3*s);break;
  case'tuft':c.fillStyle=rgb(mix(b.g,[30,60,20],.4));for(let i=-1;i<=1;i++)c.fillRect(x+i*1.5*s+Math.sin(tsec*2+x)*.6,y-4*s+Math.abs(i)*s,s,4*s);break;
  case'yucca':c.fillStyle='#5a4a2a';c.fillRect(x-s,y-5*s,2*s,5*s);c.strokeStyle='#6b7a3a';c.lineWidth=1;c.beginPath();for(let k=-3;k<=3;k++){c.moveTo(x,y-5*s);c.lineTo(x+k*2.2*s,y-10*s+Math.abs(k)*s)}c.stroke();break;
  case'fern':c.strokeStyle=rgb(mix(b.m,[70,140,70],.5));c.lineWidth=1;c.beginPath();for(let k=-2;k<=2;k++){c.moveTo(x,y);c.lineTo(x+k*2.5*s,y-6*s+Math.abs(k)*s)}c.stroke();break;
  }
}
function props(b,y,speed,size,cell,dens,seed,wx,low){
  const off=wx*speed,i0=Math.floor(off/cell)-1;
  for(let i=i0;i<i0+Math.ceil(W/cell)+3;i++){
    if(hash(i*13.7+seed)>dens)continue;
    const x=i*cell-off+hash(i*3.1+seed)*cell*.6;
    let list=low?['rock','bush','tuft','tuft']:b.props;
    const type=list[Math.floor(hash(i*9.9+seed)*list.length)];
    prop(type,x,y+((hash(i*5.5+seed)*6)|0),size*(.8+hash(i*2.2+seed)*.5),b);
  }
}
function lmDraw(lm,x,light){
  const c=ctx,y=131;
  switch(lm.type){
  case'town':{const cols=['#8a5a3a','#a06a42','#7b4e30'];[-40,-8,24].forEach((o,i)=>{const hx=x+o,w=22+i*2,h=14+i*3;c.fillStyle=cols[i];c.fillRect(hx,y-h,w,h);c.fillStyle='#3d2616';c.beginPath();c.moveTo(hx-2,y-h);c.lineTo(hx+w/2,y-h-9);c.lineTo(hx+w+2,y-h);c.fill();c.fillStyle=light<.55?'#ffd36a':'#2a1a0c';c.fillRect(hx+4,y-h+4,4,4);c.fillRect(hx+w-8,y-h+4,4,4);c.fillStyle='#2a1a0c';c.fillRect(hx+w/2-2,y-7,4,7)});
    c.fillStyle='#4a2f1c';c.fillRect(x+4,y-34,3,12);c.fillStyle='rgba(230,230,230,.5)';for(let k=0;k<3;k++){const t=(tsec*6+k*9)%27;c.fillRect(x+5+Math.sin(t*.4+k)*3,y-36-t,3,3)}break}
  case'fort':{c.fillStyle='#6b4a2a';for(let i=0;i<20;i++){const e=i%3===0?2:0;c.fillRect(x-30+i*3,y-18-e,2.4,18+e)}
    c.fillStyle='#7a5632';c.fillRect(x-36,y-30,10,30);c.fillRect(x+26,y-30,10,30);c.fillStyle='#4e341c';c.fillRect(x-37,y-32,12,3);c.fillRect(x+25,y-32,12,3);
    c.fillStyle='#2b1c10';c.fillRect(x-5,y-14,10,14);c.fillStyle='#caa46a';c.fillRect(x+30,y-48,1,18);c.fillStyle='#c0392b';
    for(let k=0;k<10;k++)c.fillRect(x+31+k,y-48+Math.sin(tsec*6+k*.7)*1.5,1,6);
    if(light<.55){c.fillStyle='#ffd36a';c.fillRect(x-33,y-24,3,3);c.fillRect(x+29,y-24,3,3)}break}
  case'rock':{c.fillStyle=rgb(mix([160,120,90],[60,60,80],.0));c.beginPath();c.moveTo(x-24,y);c.lineTo(x-8,y-30);c.lineTo(x+8,y-30);c.lineTo(x+24,y);c.fill();c.fillStyle='#a5775a';c.fillRect(x-4,y-76,8,48);c.fillStyle='#c39574';c.fillRect(x+1,y-76,3,48);c.fillStyle='#8a5f46';c.fillRect(x-5,y-78,10,3);break}
  case'boulder':{c.fillStyle='#8c8c88';c.beginPath();c.ellipse(x,y,46,28,0,Math.PI,2*Math.PI);c.fill();c.fillStyle='rgba(255,255,255,.12)';c.beginPath();c.ellipse(x-8,y-6,30,18,0,Math.PI,2*Math.PI);c.fill();c.fillStyle='rgba(40,40,40,.55)';for(let i=0;i<26;i++){const px=x-36+hash(i)*72,py=y-4-hash(i+9)*20;if(((px-x)/46)**2+((py-y)/28)**2<.8)c.fillRect(px,py,2+hash(i+3)*3,1)}break}
  case'pass':{c.fillStyle='#7d8da3';c.beginPath();c.moveTo(x-90,y-8);c.lineTo(x-52,y-86);c.lineTo(x-12,y-8);c.fill();c.beginPath();c.moveTo(x+8,y-8);c.lineTo(x+48,y-72);c.lineTo(x+92,y-8);c.fill();c.fillStyle='#f0f4f8';c.beginPath();c.moveTo(x-52,y-86);c.lineTo(x-62,y-66);c.lineTo(x-44,y-70);c.lineTo(x-38,y-62);c.lineTo(x-46,y-70);c.fill();c.beginPath();c.moveTo(x+48,y-72);c.lineTo(x+38,y-56);c.lineTo(x+56,y-60);c.lineTo(x+62,y-52);c.fill();break}
  case'forest':{for(let i=0;i<11;i++)prop('pine',x-80+i*16+hash(i)*6,y+hash(i+4)*4,1.1+hash(i+2)*.7,biome(1100));break}
  case'mill':{c.fillStyle='#7a5a3a';c.fillRect(x-30,y-34,34,34);c.fillStyle='#5a3f26';for(let k=0;k<6;k++)c.fillRect(x-30,y-32+k*6,34,1);c.fillStyle='#4a3020';c.beginPath();c.moveTo(x-34,y-34);c.lineTo(x-13,y-50);c.lineTo(x+8,y-34);c.fill();c.fillStyle='#2a1a0c';c.fillRect(x-24,y-16,8,16);c.fillStyle=light<.6?'#ffd36a':'#2a1a0c';c.fillRect(x-8,y-26,6,6);
    const wx=x+16,wy=y-14,a=tsec*1.1;c.strokeStyle='#3a2615';c.lineWidth=2;c.beginPath();c.arc(wx,wy,13,0,6.2832);c.stroke();c.lineWidth=1;c.beginPath();for(let k=0;k<8;k++){const an=a+k*Math.PI/4;c.moveTo(wx,wy);c.lineTo(wx+Math.cos(an)*13,wy+Math.sin(an)*13)}c.stroke();

/* =====================================================================
   SIMULATION
   ===================================================================== */
function update(dt){
  tsec+=dt;
  if(todT!==null){const d=((todT-tod+1.5)%1)-.5;if(Math.abs(d)<.004){if(!camp)todT=null}else tod=(tod+Math.sign(d)*Math.min(Math.abs(d),dt*.15)+1)%1}
  else tod=(tod+dt/110)%1;
  let target=0;
  if(mode==='title')target=2.6;
  else if(mode==='travel'&&!paused){target=dayMiles()/2.8;const nx=LM[G.lm+1];if(nx)target=Math.min(target,Math.max(.8,(stopAt(nx)-G.miles)*3))}
  speedNow=lerp(speedNow,target,1-Math.exp(-dt*4));if(speedNow<.02&&target===0)speedNow=0;
  const prev=G.miles;
  if(mode!=='hunt'&&speedNow>0)G.miles+=speedNow*dt;
  if(mode==='title'&&G.miles>1100)G.miles=0;
  if(mode==='travel'&&!paused){
    dayAcc+=G.miles-prev;
    while(dayAcc>=dayMiles()&&mode==='travel'){dayAcc-=dayMiles();dayTick(false);if(Q.length&&mode==='travel'){nextEvent()}}
    const nx=LM[G.lm+1];
    if(nx&&G.miles>=stopAt(nx)&&mode==='travel'){G.miles=stopAt(nx);speedNow=0;arrive()}
  }
  if(speedNow>.4&&mode!=='hunt'&&Math.random()<dt*40*speedNow/5){const wet=LM.some(l=>l.type==='river'&&Math.abs(170+(l.m-G.miles)*PXM-40)<36);dust.push({x:36+rnd(0,12),y:149+rnd(-1,1),vx:-rnd(10,30)*speedNow/5,vy:-rnd(6,16)*(wet?2.2:1),l:.7,m:.7,s:rnd(1.5,3),wet:wet})}
  dust=dust.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;return p.l>0});
  sparks=sparks.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=10*dt;p.l-=dt;return p.l>0});
  floats=floats.filter(f=>{f.y-=14*dt;f.l-=dt;return f.l>0});
  pings=pings.filter(p=>{p.l-=dt;return p.l>0});
  clouds.forEach(cl=>{cl.x-=cl.v*dt*(1+speedNow*.05);if(cl.x<-40)cl.x=W+10});
  wp.forEach(p=>{if(weather==='rain'){p.y+=(150+p.v*80)*dt;p.x-=20*dt}else{p.y+=(18+p.v*22)*dt;p.x+=Math.sin(tsec+p.v*9)*10*dt-speedNow*4*dt}if(p.y>H){p.y=-4;p.x=Math.random()*W}if(p.x<0)p.x=W;if(p.x>W)p.x=0});
  const light=clamp(Math.sin((tod-.25)*6.2832)*1.4+.5,0,1);
  if(light>.6&&weather==='clear'&&Math.random()<dt*.15&&birds.length<4)birds.push({x:-8,y:rnd(14,56),v:rnd(18,30),ph:Math.random()*6});
  birds=birds.filter(bd=>{bd.x+=bd.v*dt;bd.ph+=dt*12;return bd.x<W+10});
  const b=biome(G.miles),sc=weather==='snow'?.5:(b.snow?.18:0);snowCover=lerp(snowCover,sc,dt*.5);
  if(weather==='rain'&&Math.random()<dt*.25)flash=.25;if(flash>0)flash=Math.max(0,flash-dt);
  if(mode==='hunt')updateHunt(dt);
}
function stopAt(l){return l.type==='river'?l.m-3.5:l.m}
function pickWeather(){
  const b=biome(G.miles),prev=weather;
  if(prev!=='clear'&&Math.random()<.5)return;
  if(b.snow)weather=Math.random()<.45?'snow':'clear';
  else weather=Math.random()<.17?'rain':'clear';
}
function dayTick(quiet,still){
  G.day++;
  const al=alive(),need=al.length*[0,1,2,3][G.ration];let starving=false;
  if(G.food>=need)G.food-=need;else{G.food=0;starving=true;msg('Out of food. Everyone is going hungry.')}
  if(!starving&&G.food<need*4&&!G.f.lowWarn){G.f.lowWarn=1;msg('Food is running low. Hunt, buy more, or ease the rations.')}
  if(G.food>need*8)G.f.lowWarn=0;
  al.forEach(p=>{
    let d=(still?0:[0,.5,0,-1.5][G.pace])+[0,-1,0,1][G.ration];
    if(starving)d-=9;
    if(weather==='snow'&&biome(G.miles).snow&&!still)d-=1.5;if(weather==='rain'&&!still)d-=.5;
    if(G.morale<10)d-=2;
    if(p.sick){d-=3;if(Math.random()<(still?.4:.22))p.sick=false}
    if(d>=0&&!starving)d+=.5;
    p.hp=clamp(p.hp+d,0,100);
  });
  G.morale=clamp(G.morale+(still?0:[0,.5,0,-1][G.pace])+[0,-1,0,.5][G.ration]-(starving?4:0),0,100);
  const wasW=weather;pickWeather();
  const bn=biome(G.miles).name;if(G.bn&&G.bn!==bn)msg('You enter the '+bn+'.');G.bn=bn;
  if(weather!==wasW){if(weather==='rain')msg('Rain sets in.');else if(weather==='snow')msg('Snow begins to fall.');else msg('The weather clears.')}
  if(!quiet){
    if(Math.random()<.05&&al.length){const p=pick(al);if(!p.sick){p.sick=true;msg(esc(p.n)+' has fallen ill.')}}
    const nx=LM[G.lm+1];
    if(nx&&nx.m-G.miles>4&&Math.random()<.2)Q.push(randomEvent());
    if(G.day%10===0)save();
  }
  const left=DEADLINE-G.day;
  if(G.lm<10){
    if(left<=30&&!G.f.w30){G.f.w30=1;msg('Thirty days until first frost.')}
    if(left<=10&&!G.f.w10){G.f.w10=1;msg('Ten days until first frost. Hurry.')}
    if(G.day>DEADLINE&&!G.f.late){G.f.late=1;G.morale=clamp(G.morale-8,0,100);Q.push({title:'First Frost',text:'You wake to white grass and breath like smoke. The frost has come. Whatever waits at Dry Creek, you are late.\n\nMara says nothing. Tobias counts the notches on his stick again, as if the number might change.'})}
  }
  checkDeaths();hud();
}
function checkDeaths(){
  G.party.forEach(p=>{
    if(p.hp<=0&&!p.dead&&!p.left){p.dead=true;p.hp=0;buzz([80,50,80]);G.morale=clamp(G.morale-12,0,100);jr(p.n+' died on the trail near '+biome(G.miles).name+'.');
      if(p.role==='you'){Q.length=0;Q.push(gameOverEvent())}else Q.push(deathEvent(p))}
  });
  if(!G.over&&alive().length===0){Q.length=0;Q.push(gameOverEvent())}
}
function arrive(){
  G.lm++;const lm=LM[G.lm];mode='event';jr('Reached '+lm.name+'.');
  const fn=STORY[G.lm];if(fn)fn();
  if(!Q.length)Q.push({title:lm.name,text:'You make camp.'});
  nextEvent();
}

/* =====================================================================
   UI
   ===================================================================== */
function hud(){
  if(mode==='title'||mode==='setup'){$('hud').innerHTML='';return}
  const nx=LM[G.lm+1],left=Math.max(0,DEADLINE-G.day),al=alive().length,lowFood=G.food<al*[0,1,2,3][G.ration]*4;
  $('hud').innerHTML='<div class="chips r1"><span class="chip">\uD83D\uDCC5 '+dateStr(true)+' \u00B7 \u2744 '+left+'d</span><span class="chip">\uD83E\uDDED '+(nx?Math.ceil(nx.m-G.miles)+' mi \u2192 '+nx.name:'Journey\u2019s end')+'</span></div>'+
  '<div class="chips r2" style="margin-top:5px"><span class="chip'+(lowFood?' warn':'')+'">\uD83C\uDF56 '+Math.round(G.food)+' lb</span><span class="chip">\uD83D\uDCB0 $'+G.money+'</span><span class="chip">\uD83D\uDD27 '+G.parts+'</span><span class="chip">\uD83D\uDD2B '+G.ammo+'</span><span class="chip'+(G.morale<25?' warn':'')+'">\u2764 '+Math.round(G.morale)+'%</span></div>'+
  '<div class="party">'+G.party.filter(p=>!p.left).map(p=>'<div class="mem '+(p.dead?'dead':'')+'">'+esc(p.n)+(p.sick?' \uD83E\uDD12':'')+'<div class="bar"><i style="width:'+p.hp+'%;background:'+(p.hp>60?'#6fbf5a':p.hp>30?'#e0b040':'#d9534f')+'"></i></div></div>').join('')+'</div>';
  const r=$('route');if(r)r.innerHTML=routeHtml();
}
function routeHtml(){
  const total=LM[LM.length-1].m;
  return LM.map((l,i)=>'<i class="'+(i<=G.lm?'v':'')+'" title="'+l.name+'" style="left:'+(l.m/total*100)+'%"></i>').join('')+'<b style="left:'+Math.min(100,G.miles/total*100)+'%"></b>';
}
function renderTitle(){
  G=blank();paused=false;hunt=null;mode='title';Q=[];camp=false;todT=null;weather='clear';$('hud').innerHTML='';
  $('panel').innerHTML='<div style="text-align:center;padding-top:4px"><div class="small">1848</div><h1>THE LAST<br>LETTER WEST</h1><p style="margin:0 0 10px;color:#cdbb97;line-height:1.4">Twelve hundred miles. One water-stained letter.<br>A man who wants it burned.</p></div>'+
  '<button class="big" data-a="new">▶ Begin the journey</button>'+(hasSave()?'<button class="big" data-a="cont">↻ Continue your journey</button>':'')+
  '<p class="fine" style="text-align:center">Offline. Tap text to skip the typing. Every choice leaves a mark.</p>';
}
function renderSetup(){
  mode='setup';
  $('panel').innerHTML='<h2>Before you leave</h2><div class="lbl">Your name</div><input id="nm" maxlength="14" value="Ada" autocomplete="off">'+
  '<div class="lbl">How do you pack the wagon?</div>'+
  '<button class="big" data-a="kit" data-v="prov"><b>The Provisioner</b><br><span style="font-weight:400">+180 lb of food. You will not go hungry easily.</span></button>'+
  '<button class="big" data-a="kit" data-v="safe"><b>The Cautious</b><br><span style="font-weight:400">+2 spare wagon parts and +30 ammunition.</span></button>'+
  '<button class="big" data-a="kit" data-v="cash"><b>The Frugal</b><br><span style="font-weight:400">+$200 to spend at the forts.</span></button>';
}
function renderTravel(){
  const row=(a,cur,list)=>'<div class="grid3">'+list.map(v=>'<button data-a="'+a+'" data-v="'+v[0]+'" class="'+(cur==v[0]?'on':'')+'">'+v[1]+'</button>').join('')+'</div>';
  const paceH=['','10 miles a day. Gentle on everyone.','15 miles a day. A steady plod.','20 miles a day. Wears everyone down.'][G.pace];
  const rationH=['','1 lb per person a day. Health suffers.','2 lb per person a day.','3 lb per person a day. Health recovers.'][G.ration];
  const acts='<div class="grid4" style="margin-top:4px"><button data-a="hunt">\uD83C\uDFF9 Hunt</button><button data-a="rest">\u26FA Rest</button><button data-a="journal">\uD83D\uDCD6 Journal</button><button data-a="pause">'+(paused?'\u25B6 Go':'\u275A\u275A Pause')+'</button></div>';
  $('panel').innerHTML='<div class="route" id="route">'+routeHtml()+'</div>'+acts+
  '<div class="lbl">Pace</div>'+row('pace',G.pace,[[1,'Slow'],[2,'Steady'],[3,'Hurry']])+'<div class="hint">'+paceH+'</div>'+
  '<div class="lbl">Rations</div>'+row('ration',G.ration,[[1,'Scant'],[2,'Normal'],[3,'Full']])+'<div class="hint">'+rationH+'</div>'+
  '<div id="msg" class="msg"></div><div style="text-align:center"><button class="link" data-a="quit">Save and quit to title</button></div>';
  showMsg();
}
function fade(){const t=$('evt');if(t)t.classList.toggle('more',t.scrollHeight-t.scrollTop-t.clientHeight>6)}
let skipped=false;
function type(el,text,done){
  if(typing){clearInterval(typing.iv)}
  let i=0,fin=false;el.textContent='';skipped=false;
  const sc=el.closest&&el.closest('.evt');
  const end=(skip)=>{if(fin)return;fin=true;clearInterval(iv);typing=null;skipped=!!skip;el.textContent=text;if(sc)sc.scrollTop=skip?0:sc.scrollHeight;fade();done&&done()};
  const iv=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);if(sc)sc.scrollTop=sc.scrollHeight;if(i>=text.length)end(false)},16);
  typing={iv:iv,finish:()=>end(true)};
}
function nextEvent(){
  if(Q.length){let e=Q.shift();if(typeof e==='function')e=e();showEvent(e)}else endEvents();
}
function endEvents(){
  if(G.over||mode==='end'||mode==='title')return;
  $('hud').classList.remove('compact','res');
  if(camp)todT=.28;camp=false;mode='travel';
  if(!G.f.started){G.f.started=1;msg('The wagon rolls out. Watch your food and your people.')}
  renderTravel();hud();save();
}
function showEvent(e,instant){
  $('hud').classList.toggle('compact',!e.keepHud);$('hud').classList.toggle('res',e.keepHud==='res');
  const wasCamp=camp;if(mode!=='end')mode='event';cur=e;camp=!!e.camp;todT=e.camp?.93:(wasCamp?.28:null);
  $('panel').innerHTML='<div class="ev"><div class="evt" id="evt"><h2>'+e.title+'</h2><div class="story'+(e.letter?' letter':'')+'" id="st"></div></div><div class="evc" id="ch"></div></div>';
  hud();$('evt').addEventListener('scroll',fade);
  if(instant){$('st').textContent=e.text;skipped=true;showChoices(e);fade()}else type($('st'),e.text,()=>showChoices(e));
}
function showChoices(e){
  const list=(e.choices&&e.choices.length)?e.choices:[{t:'Continue'}],box=$('ch');if(!box)return;box.innerHTML='';
  list.forEach(c=>{
    if(c.if&&!c.if())return;
    const b=document.createElement('button');b.className='big'+(e.sm?' sm':'');b.textContent=c.t;
    if(c.dis&&c.dis()){b.disabled=true;b.textContent+=' — '+(c.why||'unavailable')}
    b.onclick=()=>choose(c);box.appendChild(b);
  });
  const t=$('evt');if(t&&!skipped)t.scrollTop=t.scrollHeight;fade();
}
function choose(c){
  const r=c.go?c.go():c;
  if(r.run)r.run();
  if(r.stop)return;
  const tags=r.fx?ch(r.fx):'';
  checkDeaths();hud();
  if(r.text)outcome(r.text,tags,r.after);else{if(r.after)r.after();nextEvent()}
}
function outcome(text,tags,after){
  $('ch').innerHTML='';
  type($('st'),text,()=>{
    $('ch').innerHTML=tags;const b=document.createElement('button');b.className='big';b.textContent='Continue';b.style.textAlign='center';
    b.onclick=()=>{if(after)after();nextEvent()};$('ch').appendChild(b);const t=$('evt');if(t&&!skipped)t.scrollTop=t.scrollHeight;fade();
  });
}
function ch(o){
  const t=[];
  for(const k in o){const v=o[k];if(!v)continue;
    if(k==='food'){G.food=Math.max(0,G.food+v);t.push(['🍖 Food',v])}
    else if(k==='money'){G.money=Math.max(0,G.money+v);t.push(['💰 $',v])}
    else if(k==='parts'){G.parts=Math.max(0,G.parts+v);t.push(['🔧 Parts',v])}
    else if(k==='ammo'){G.ammo=Math.max(0,G.ammo+v);t.push(['🔫 Ammo',v])}
    else if(k==='morale'){G.morale=clamp(G.morale+v,0,100);t.push(['❤ Morale',v])}
    else if(k==='hp'){alive().forEach(p=>p.hp=clamp(p.hp+v,0,100));t.push(['✚ Health (all)',v])}
    else if(k==='days'){for(let i=0;i<v;i++)dayTick(true,true);t.push(['⏳ Days',v])}
  }
  if(t.some(x=>x[1]<0&&x[0].indexOf('Days')<0))buzz(30);
  return '<div class="tags">'+t.map(x=>'<b class="'+(x[1]>0?(x[0].indexOf('Days')>=0?'dn':'up'):'dn')+'">'+x[0]+' '+(x[1]>0?'+':'')+x[1]+'</b>').join('')+'</div>';
}
function showJournal(){
  paused=true;
  const done=mode==='travel'?'renderTravel':null;
  $('panel').innerHTML='<h2>Journal</h2>'+(G.journal.length?G.journal.slice().reverse().map(j=>'<div class="jr"><small>'+j.d+'</small>'+esc(j.t)+'</div>').join(''):'<p>Nothing yet.</p>')+'<button class="big" data-a="close" style="text-align:center">Close</button>';
}

/* ---------- input ---------- */
$('panel').addEventListener('click',e=>{
  if(typing&&!e.target.closest('button')){typing.finish();return}
  const b=e.target.closest('[data-a]');if(!b)return;act(b.dataset.a,b.dataset.v);
});
cv.addEventListener('pointerdown',e=>{
  if(mode==='hunt'){const r=cv.getBoundingClientRect();shoot((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H)}
});
function act(a,v){
  if(a==='new'){renderSetup()}
  else if(a==='cont'){if(load()){Q=[];camp=false;todT=null;dayAcc=0;mode='travel';paused=false;speedNow=0;renderTravel();hud()}}
  else if(a==='kit'){startGame(v)}
  else if(a==='pace'){G.pace=+v;renderTravel()}
  else if(a==='ration'){G.ration=+v;renderTravel()}
  else if(a==='pause'){paused=!paused;renderTravel()}
  else if(a==='journal'){showJournal()}
  else if(a==='quit'){save();renderTitle()}
  else if(a==='close'){paused=false;if(mode==='end')showEvent(cur,true);else renderTravel()}
  else if(a==='hunt'){startHunt()}
  else if(a==='rest'){
    if(mode!=='travel')return;
    for(let i=0;i<2;i++)dayTick(true,true);
    alive().forEach(p=>{p.hp=clamp(p.hp+8,0,100);if(p.sick&&Math.random()<.5)p.sick=false});
    G.morale=clamp(G.morale+2,0,100);msg('You rest for two days. Mending, mostly.');hud();
    if(Q.length)nextEvent();
  }
}
function startGame(kit){
  Q=[];camp=false;todT=null;hunt=null;
  const nm=($('nm').value||'').trim().slice(0,14)||'Ada';
  G=blank();G.name=nm;G.party[0].n=nm;
  if(kit==='prov')G.food+=180;else if(kit==='safe'){G.parts+=2;G.ammo+=30}else G.money+=200;
  weather='clear';tod=.3;dayAcc=0;paused=false;
  jr('Left Independence with a letter, a tin box and three people who depend on me.');
  mode='event';
  Q.push(
   {title:'Independence, Missouri',text:'April, 1848.\n\nThe letter reached you three weeks ago. A drover brought it, folded small and stained with something that might have been river water.\n\nElias—your brother—left for Oregon a year ago to stake a claim in the Willamette Valley. He promised to send for his wife and son by spring. Nothing came. Not a line, not a rumor. Until this.'},
   {title:'The Letter',letter:true,text:'“Come now. Sell what you must. Bring the deed box and tell no one why.\n\nSilas Marsh is no honest surveyor. Whatever he offers, do not sign.\n\nIf I am not at the mill on Dry Creek by first frost, look under the wheel.\n\nForgive the haste. They are reading over my shoulder.\n\n— E.”'},
   {title:'The Wagon',text:'The farm is sold. The wagon is loaded.\n\nMara—Elias’s wife—sits very straight on the seat, her hands folded over the tin deed box in her lap. Tobias, nine years old, is already counting days on a notched stick. Old Hollis, the teamster you hired, spits over the wheel and clucks to the oxen.\n\n“Twelve hundred miles,” he says. “Rivers, mountains, strangers. Never easy.”\n\nFirst frost falls around the middle of October. You have '+DEADLINE+' days.'}
  );
  nextEvent();
}

   HUNTING
   ===================================================================== */
function startHunt(){
  if(mode!=='travel')return;
  if(G.ammo<=0){msg('No ammunition left.');return}
  $('hud').classList.remove('compact','res');mode='hunt';hunt={t:14,bag:0,shots:0,animals:[],spawn:0,recoil:0};camp=false;
  $('panel').innerHTML='<h2>The Hunt</h2><div class="hunt"><span>⏱ <b id="hT">14</b>s</span><span>🔫 <b id="hA">'+G.ammo+'</b></span><span>🍖 <b id="hB">0</b> lb</span></div><p class="fine">Tap the animals on the screen. Each tap costs one bullet. You can carry 150 lb of meat.</p>';
}
function updateHunt(dt){
  hunt.t-=dt;hunt.spawn-=dt;hunt.recoil=Math.max(0,hunt.recoil-dt*4);
  if(hunt.spawn<=0){hunt.spawn=rnd(.45,.9);const r=Math.random(),type=r<.45?'rabbit':r<.85?'deer':'bison',dir=Math.random()<.5?1:-1,sp={rabbit:[70,110],deer:[50,80],bison:[22,34]}[type];
    hunt.animals.push({type:type,x:dir>0?-20:W+20,y:rnd(122,168),vx:dir*rnd(sp[0],sp[1]),ph:Math.random()*6,val:{rabbit:4,deer:30,bison:80}[type]})}
  hunt.animals=hunt.animals.filter(a=>{a.x+=a.vx*dt;return a.x>-40&&a.x<W+40});
  const el=$('hT');if(el){el.textContent=Math.max(0,Math.ceil(hunt.t));$('hA').textContent=G.ammo;$('hB').textContent=hunt.bag}
  if(hunt.t<=0||G.ammo<=0)endHunt();
}
function shoot(x,y){
  if(!hunt||G.ammo<=0)return;
  G.ammo--;hunt.shots++;hunt.recoil=.35;pings.push({x:x,y:y,l:.3});buzz(12);
  let best=null,bd=1e9;
  hunt.animals.forEach(a=>{const sz={rabbit:10,deer:16,bison:22}[a.type],dx=Math.abs(x-a.x),dy=Math.abs(y-(a.y-sz*.5));if(dx<sz+8&&dy<sz+10&&dx+dy<bd){bd=dx+dy;best=a}});
  if(best){const val=Math.round(best.val*(member('Wren')&&!member('Wren').dead?1.25:1));hunt.bag+=val;hunt.animals.splice(hunt.animals.indexOf(best),1);floats.push({x:best.x-8,y:best.y-12,t:'+'+val+' lb',l:1.2});for(let i=0;i<8;i++)sparks.push({x:best.x,y:best.y-6,vx:rnd(-30,30),vy:-rnd(10,40),l:.5})}
  else floats.push({x:x-6,y:y,t:'miss',l:.6});
}
function endHunt(){
  const got=Math.min(hunt.bag,150),left=hunt.bag-got,shots=hunt.shots;hunt=null;mode='event';
  const text=got>0?'The shots echo and die across the grass. You dress the kill and haul '+got+' pounds of meat back to the wagon.'+(left>0?' The rest you leave for the wolves; there is no room.':''):'You return empty-handed, with grass in your hair and a lesson in patience.';
  Q.push({title:'The Hunt',text:text,choices:[{t:'Continue',go:()=>({text:'A day well spent, or at least spent.',fx:{food:got,days:1}})}]});
  nextEvent();
}

function shopEvent(name,flav){
  return{keepHud:'res',sm:true,title:name+' — Trading Post',text:flav+'\n\nYou have $'+G.money+'.',choices:[
   {t:'Food, 100 lb — $18',dis:()=>G.money<18,why:'not enough money',go:()=>({text:'Salt pork and flour, weighed out on a brass scale.',fx:{money:-18,food:100},after:()=>Q.unshift(shopEvent(name,flav))})},
   {t:'Ammunition, 20 rounds — $8',dis:()=>G.money<8,why:'not enough money',go:()=>({text:'Paper cartridges, counted twice.',fx:{money:-8,ammo:20},after:()=>Q.unshift(shopEvent(name,flav))})},
   {t:'Spare wheel or axle — $25',dis:()=>G.money<25,why:'not enough money',go:()=>({text:'Good seasoned oak. Heavy, but worth it.',fx:{money:-25,parts:1},after:()=>Q.unshift(shopEvent(name,flav))})},
   {t:'Medicine and a poultice — $20',dis:()=>G.money<20,why:'not enough money',go:()=>({text:'Everyone is fed, dosed and dressed. The sick recover.',run:()=>alive().forEach(p=>p.sick=false),fx:{money:-20,hp:15},after:()=>Q.unshift(shopEvent(name,flav))})},
   {t:'Leave the post'}
  ]};
}
function riverEvent(name,risk,fee){
  return{title:name,text:name==='Kansas River'?'The Kansas runs brown and fast with spring melt. A ferryman waves from the far bank, shouting a price you can’t hear.':'The Snake is wide, cold and loud. Its far bank looks very small.',choices:[
   {t:'Ford the river (free, risky)',go:()=>Math.random()>risk?{text:'The oxen strain, the water claws at the wheels—and then gravel, and then the far bank. Hollis lets out a long breath.',fx:{}}:{text:'A wheel drops into a hole. The wagon lurches and a barrel is gone before anyone can grab it.',fx:{food:-ri(40,90),hp:-8,parts:-1}}},
   {t:'Caulk the wagon and float it (1 day)',go:()=>Math.random()>risk*.55?{text:'It rides low and smug across the current, bobbing like a cork.',fx:{days:1}}:{text:'Water finds the seams. You lose flour and dignity, but everyone reaches the far bank.',fx:{days:1,food:-ri(25,50)}}},
   {t:'Pay the ferry ($'+fee+')',dis:()=>G.money<fee,why:'not enough money',go:()=>({text:'Dry feet and a lighter purse. The ferryman does not smile.',fx:{money:-fee}})},
   {t:'Wait a day for the water to drop',go:()=>({text:'You watch the river, and the river watches you. By evening it has fallen an inch.',fx:{days:1},after:()=>Q.unshift(riverEvent(name,Math.max(.1,risk-.15),fee))})}
  ]};
}

   Q.push({title:'A Note at Dawn',text:'In the morning, a paper is nailed to the wagon’s tailgate, fluttering.\n\nTURN BACK WHILE YOU CAN.\n\nNo signature. The paper is heavy, cream-colored, with a watermark you recognize from the fort: the Willamette Land Company.'+(G.f.escort?'\n\nYou remember Marsh’s escort turning back at the Platte fork, waving cheerfully.':''),choices:[
     {t:'Keep the note as evidence.',go:()=>{clue('Threat note on Land Company stationery at Chimney Rock.');return{text:'You fold it into the tin box beside the deed. Evidence is just a letter that hasn’t been read yet.',fx:{morale:-3}}}},
     {t:'Burn it and say nothing.',go:()=>({text:'The flames take it quickly. You carry the secret instead.',fx:{morale:2}})},
     {t:'Show everyone.',go:()=>{clue('Threat note on Land Company stationery at Chimney Rock.');return{text:'Hollis loads his rifle without a word. Tobias stares at the paper. Mara reads it twice and puts her chin up.',fx:{morale:-5}}}}]});
 },
 4:()=>{
   Q.push(shopEvent('Fort Laramie','Traders, trappers, Lakota families bartering furs, soldiers drilling in the heat. Prices are steep, but the shelves are full.'));
   Q.push({title:'Marsh’s Offer',text:'You find Marsh waiting on the porch of the sutler’s store, as if it had been arranged. He sets his hat on the rail and lowers his voice.\n\n“Let us be plain. That box under Mrs. Rowan’s arm holds Elias’s original claim papers. They are worthless to you and inconvenient to me. Four hundred dollars, and a berth on the company steamer from The Dalles. No more mountains, no more river crossings. Think of the boy.”',choices:[

 },
 5:()=>{
   clue('Elias’s carving on Independence Rock: “DC MILL — THE WHEEL KNOWS.”');G.f.wheel=1;G.morale=clamp(G.morale+12,0,100);
   Q.push({title:'Independence Rock',text:'The rock rises from the plain like a great gray whale, its sides crowded with names cut by those who came before. Mara runs her fingers over them, searching.\n\nThen she stops. Low on the south face, cut deep and fresh:\n\nE.R. — JUNE 1847 — ALIVE & WELL\n\nBeneath, smaller, with an arrow: DC MILL — THE WHEEL KNOWS.\n\nShe sits down in the sand and laughs, then cries, and Tobias puts his hand in hers.',choices:[
     {t:'Carve your own names beside his.',go:()=>({text:'ROWAN — 1848 — WE CAME. Tobias insists on carving the last word himself. It takes him an hour.',fx:{morale:6}})},
     {t:'Press on. Daylight is precious.',go:()=>({text:'Mara looks back at the carving until it is a speck, then until it is only a wish.'})},
     {t:'Search the rock for more of Elias’s marks. (1 day)',go:()=>({text:'In a crevice, wrapped in oilcloth: dried meat, a box of cartridges and a note. “For whoever follows. Take it. I’m sorry for all of this. — E.”',fx:{days:1,food:80,ammo:10,morale:6}})}]});
 },
 6:()=>{
   const wren=member('Wren'),hol=member('Hollis');
   Q.push({title:'South Pass',text:'Snow in the pass, in what ought to be summer. The wind drives it sideways. The oxen lean into their yokes like men walking into prison.\n\nOn the ridge behind you, tiny against the white: four riders, keeping pace, never closing.\n\n'+((wren&&!wren.dead)?'“Company guns,” Wren says quietly. “Marsh doesn’t ride himself. He pays.”':'“Been on us since the fork,” Hollis says. “Hired men have a look about them.”'),choices:[
     {t:'Take the high cut-off: faster, but brutal.',go:()=>({text:'You lose the riders in the whiteout. Mara’s lips are blue and Tobias coughs the whole night, but behind you the ridge is empty.',fx:{hp:-15,parts:Math.random()<.25?-1:0}})},
     {t:'Take the valley road: safer, but they will close in.',go:()=>({text:'The valley is sheltered and slow. The riders are a little nearer every dawn.',fx:{food:-15}})},
     {t:'Make a stand at the narrows. (10 ammo)',dis:()=>G.ammo<10,why:'not enough ammo',go:()=>({text:'A few shots from the rocks are enough to make hired men reconsider their wages.',run:()=>{G.f.stand=1;G.f.delayed=1},fx:{ammo:-10,hp:-5,morale:5}})}]});
   Q.push(function(){
     if(!hol||hol.dead)return{title:'The Summit',camp:true,text:'You cross the summit in a hard clear dawn. You miss Hollis’s grumbling more than you would have guessed.',choices:[{t:'Continue',go:()=>({text:'The descent is long and cold.',fx:{morale:-2}})}]};
     return{title:'A Night in the Pass',camp:true,text:'The fire gutters. Hollis sits with his rifle across his knees, looking at the ridge.\n\n“I’ve buried a lot of men on roads like this,” he says. “Never found the sense in it. Here’s what I know. Four riders can’t be shaken by pushing hard. Somebody has to hold the narrows while you cross.”\n\nHe looks at you. “It might as well be an old man who doesn’t need to see Oregon.”',choices:[
      {t:'Refuse. We go together.',go:()=>({text:'“Stubborn,” Hollis says, almost fondly. In the morning you all cross together, and it costs everyone dearly.',fx:{hp:-12,morale:8}})},
      {t:'Accept. Thank him.',go:()=>({text:'He shakes your hand—a farmer’s hard grip. By morning he is gone from the fire. A single shot echoes from the narrows. Then silence. Much later you reach the summit, and no one speaks.',run:()=>{hol.dead=true;hol.hp=0;G.f.delayed=1;G.f.sacrifice=1;jr('Hollis held the narrows at South Pass so we could cross.')},fx:{morale:-15}})},
      {t:'All of us hold the narrows. (Wren, 15 ammo)',if:()=>wren&&!wren.dead,dis:()=>G.ammo<15,why:'not enough ammo',go:()=>({text:'You, Hollis and Wren hold the rocks until dawn. The riders retreat two men lighter. Nobody dies. It costs everything you have.',run:()=>{G.f.delayed=1},fx:{ammo:-15,hp:-10,morale:10}})}]};
   });
 },
 7:()=>{
   const wren=member('Wren');
   Q.push(shopEvent('Fort Hall','A palisade of cottonwood logs on the Snake plain, smoke and stew and the smell of horses. The last real stop before the mountains.'));
   clue('Elias’s second letter: alive three weeks ago, something hidden “where the wheel turns.”');G.morale=clamp(G.morale+10,0,100);
   Q.push({title:'A Letter at Fort Hall',letter:true,text:'At the post, the clerk hands you a single sealed envelope. Your name, in Elias’s rushed hand.\n\n“I am at the mill. They know I know. I have hidden it where the wheel turns. If you read this, trust nothing the company says and sign nothing Marsh puts in front of you.\n\nTell Mara I am sorry. Tell her I counted every day.\n\n— E.”\n\nThe postmark is three weeks old. He was alive three weeks ago.'});
   if(wren&&!wren.dead){
     Q.push({title:'Wren’s Confession',camp:true,text:'That night Wren doesn’t come to the fire. You find her at the corral, brushing a horse that doesn’t need it.\n\n“I have to tell you something,” she says, not turning. “Two years ago I scouted for the Land Company. For Marsh. I carried stakes onto claims that were already staked and never asked why. Your brother was the first man who asked me why.”\n\nShe finally faces you. “Last autumn I led him into the Blue Mountains for Marsh’s men. I didn’t know what they’d do. I know now.”',choices:[
      {t:'Forgive her. “You came back. That matters.”',go:()=>{clue('Wren’s testimony: she led Elias into Marsh’s ambush and knows how the claims were forged.');return{text:'“Then let me finish it,” she says. She tells you everything: the forged claims, the stolen ledger, why Marsh wants Elias and the deed box.',run:()=>{G.f.wrenTrust=1},fx:{morale:6}}}},
      {t:'Ask what she knows. Be angry later.',go:()=>{clue('Wren: Elias stole the company’s real ledger of forged claims, which is why Marsh wants him and the box.');return{text:'“Everything,” Wren says. “Elias stole the company’s real ledger, the one with the forgeries. That’s what they’re after.” She doesn’t ask to be forgiven.',fx:{morale:-3}}}},
      {t:'Order her to leave.',go:()=>({text:'She takes her horse and her coat and goes without a word. The road seems quieter and much longer.',run:()=>{wren.left=true;G.f.wrenGone=1;jr('Sent Wren away at Fort Hall.')},fx:{morale:-8}})}]});
   }else{
     Q.push({title:'What Mara Knew',camp:true,text:'That night Mara sits very still beside the fire.\n\n“There is something I should have told you,” she says. “The night before Elias left, he burned papers in the stove. Not all of them. He kept a book. Thick as a Bible. He wouldn’t say what it was, only that it would hang a man.”',choices:[{t:'Continue',go:()=>{clue('Mara: Elias kept a thick book he said “would hang a man.”');return{text:'The fire pops. Somewhere out in the dark a horse stamps.',fx:{morale:4}}}}]});
   }
 },
 8:()=>{Q.push(riverEvent('Snake River',.5,30))},
 9:()=>{

   Q.push({title:'The Blue Mountains',text:'Fir and fog and wet silence. On the third morning the road narrows to a ledge, and standing in the middle of it, hat in hand, is Silas Marsh.\n\n'+men+'\n\n“I admire persistence,” he says. “Truly. But persistence in the wrong direction is only stubbornness.”',choices:[
     {t:'Hand over the deed box.',if:()=>!G.f.sold,go:()=>({text:'Marsh takes it with both hands, like a man receiving a child. “Sensible,” he says, and lets you pass. Mara turns her face to the trees.',run:()=>{G.f.sold=1},fx:{morale:-15}})},
     {t:'Fight. (10 ammo)',dis:()=>G.ammo<10,why:'not enough ammo',go:()=>{
        const w=member('Wren'),h=member('Hollis'),p=.35+(G.f.delayed?.25:0)+(w&&!w.dead?.15:0)+(h&&!h.dead?.1:0);
        if(Math.random()<p)return{text:'A short, ugly fight in the fog. When it ends, Marsh’s men are running downhill and Marsh himself has vanished into the trees.',run:()=>{G.f.marshFled=1},fx:{ammo:-10,hp:-10,morale:8}};
        return{text:'The fog gives them the advantage. When it’s over, your wagon is tipped and Marsh walks away with the tin box under his arm.',run:()=>{G.f.sold=1},fx:{ammo:-15,hp:-25,food:-50,morale:-15}}}},
     {t:'Bluff: tell Marsh what you know.',dis:()=>G.clues<3,why:'you don’t know enough yet',go:()=>({text:'You speak steadily. The note on company stationery. The offer at Fort Laramie. Elias’s letter. The word “ledger” lands like a stone in a pond.\n\nMarsh’s face goes very still. “You can’t prove it.”\n“Not yet,” you say.\n\nFor a long moment the fog is the loudest thing in the world. Then he steps aside. “Dry Creek, then. Let us see who arrives first.”',run:()=>{G.f.bluff=1},fx:{morale:10}})},
     {t:'Say nothing and push past.',go:()=>({text:'You walk the ledge with your eyes ahead and your hands where he can see them. Marsh lets you pass, but his men watch every step.\n\n\u201CThe Dalles is not far,\u201D he says, almost kindly. \u201CAnd I know every road to it.\u201D',fx:{morale:-6,food:-30}})},
     {t:'Wren leads his men astray.',if:()=>{const w=member('Wren');return w&&!w.dead&&G.f.wrenTrust},go:()=>({text:'Wren slips away along a goat track. By the time Marsh realizes, her voice and his men’s have drifted a quarter-mile off through the fog. You pass.',run:()=>{G.f.trick=1},fx:{hp:-5,morale:8}})}]});
 },
 10:()=>{
   const frost=G.day>DEADLINE;G.f.elias=!frost;
   Q.push({title:'Dry Creek Mill',text:'The mill stands in a cleft of fir, silent but for the creak of its waterwheel turning in a thin stream. No smoke. No dogs. The door hangs open.'+(frost?'\n\nThe grass is already silvered with frost.':'')+'\n\nMara whispers Elias’s name once, and then cannot say it again.',choices:[
     {t:'Go to the wheel and look under it.',go:()=>({text:'You kneel in the cold mud of the wheel pit and pull at a loose stone. Behind it, wrapped in oilcloth: a ledger, thick as a Bible. Page after page of claims never filed, signatures that are not the signers’. At the back, in Elias’s hand: PROOF.',run:()=>{G.f.ledger=1;jr('Found Elias’s ledger under the mill wheel.')},after:()=>Q.unshift(millElias(),marshArrives())})},
     {t:'Search the mill and cellar for Elias.',go:()=>{
        const time=G.f.trick||G.f.marshFled||G.f.delayed;
        return{text:time?'You tear through the rooms calling his name. Then, with time to spare, you remember the wheel, and find the ledger waiting for you in the dark.':'You tear through the rooms calling his name. By the time you think of the wheel, the sound of hooves is already in the clearing.',run:()=>{if(time){G.f.ledger=1;jr('Found Elias’s ledger under the mill wheel.')}},after:()=>Q.unshift(millElias(),marshArrives())}}}]});
 }
};
function millElias(){
  if(G.f.elias)return{title:'The Cellar',text:'A scratching under the floorboards. A trapdoor. A man climbs out: gaunt, bearded, eyes too bright.\n\n“You came,” Elias says. “I told them you wouldn’t. I told them you were stubborn.”\n\nMara crosses the room in two steps. Tobias hangs back, shy, until his father says his name.',choices:[{t:'Continue',go:()=>({text:'For a long minute nobody speaks, and it is the best thing you have ever heard.',fx:{morale:20}})}]};
  return{title:'The Grave',text:'Out back, beneath a fir, a mound with a cross of split rails. E.R., and a date from the first week of the frost.\n\nIn the cellar, a cot, a candle stub, and a journal. The last page reads: “I can hear the road. I keep thinking it will be them.”\n\nYou were days too late. Mara sinks onto the doorstep. Tobias sits beside her and does not ask any questions at all.',choices:[{t:'Continue',go:()=>({text:'There is nothing to say, so you say nothing, and the creek says it for you.',fx:{morale:-25}})}]};
}
function marshArrives(){
  const f=G.f;
  const how=f.trick?'Marsh arrives hours late, mud to the thighs, furious.':f.marshFled?'Marsh limps into the clearing alone, one arm bandaged, with nothing left to lose.':f.bluff?'Marsh is already there, sitting on the mill step as though he owns it. He does not rise.':f.delayed?'Marsh rides in with only two men, and the look of someone who has slept badly for a week.':'Marsh rides into the clearing with his men.';
  return{title:'Marsh',text:how+'\n\n“Well,” he says. “Here we all are.”'+(f.ledger?'\n\nHis eyes find the oilcloth bundle in your hands.':'\n\nHis eyes search your hands, the wagon, the mill, hunting for something that is not there.'),choices:[
   {t:'Expose Marsh with the ledger.',if:()=>f.ledger,go:()=>({text:'You hold up the ledger. Nobody moves.',after:()=>endGame('justice')})},
   {t:'Trade the ledger for a clean start.',if:()=>f.ledger,go:()=>({text:'You hold out the oilcloth. Marsh’s hand closes on it like a man taking back his own heart.',after:()=>endGame('trade')})},
   {t:'Confront him with everything you know.',if:()=>!f.ledger&&G.clues>=4,go:()=>({text:'You lay it out, piece by piece, clue by clue. His smile slips, then goes.',after:()=>endGame('confront')})},
   {t:'Walk away. Take your family up the creek.',go:()=>({text:'You turn your back on him. It is the hardest thing you have ever done.',after:()=>endGame('quiet')})}]};
}

/* ---------- endings ---------- */
function deathEvent(p){
  const t={
   Mara:'Mara slips away in the grey hour before dawn, one hand still resting on the tin box. Tobias does not cry. He folds her shawl, sets it on the seat, and asks you, very politely, to tell him a story about his father. You do. You tell it badly.',
   Tobias:'Tobias, nine years old, who counted every day on a notched stick, does not wake. Mara holds him until the sun is high. Hollis digs the grave with his own hands, and nobody speaks of how small it is.',
   Hollis:'Hollis dies in the traces the way he always said he would: with his boots on and his opinions intact. You bury him beside the road. Someone has to drive the oxen now.',
   Wren:'Wren dies without a word, her army coat spread over her like a flag. Whatever she knew about Marsh, whatever she still owed, goes into the ground with her.'};
  return{title:p.n+' is gone',camp:true,text:t[p.n]||(p.n+' dies on the trail.')};
}
function gameOverEvent(){
  G.over=true;try{localStorage.removeItem('llw1')}catch(e){}
  return{title:'The Trail Takes All',camp:true,text:'The wagon stands where it stopped, canvas snapping in the wind. In the tin box there is a deed, and in the oilcloth under the seat a letter that begins “Come now.”\n\nPerhaps someone will find it. Perhaps they will read it through.',choices:[{t:'Return to the title',go:()=>({stop:true,run:()=>{renderTitle()}})}]};
}
function endGame(kind){
  const f=G.f,al=alive().length,dead=G.party.filter(p=>p.dead).map(p=>p.n),eli=f.elias;
  let title,text;
  const elias=eli?'Elias testifies, thin and unbowed, with Tobias holding his hand.':'Elias’s testimony is a journal and a grave; the court reads it aloud, and the room stays very quiet.';
  if(kind==='justice'){
    title=G.clues>=4?'THE LEDGER':'JUSTICE, MOSTLY';
    text=G.clues>=4?'Oregon City, November. The land office smells of wet wool and ink. You lay the ledger on the clerk’s desk, and for the first time since Independence, Silas Marsh has nothing to say.\n\nIt takes months. Forged claim after forged claim is unwound; families who were cheated walk the road to testify. '+elias+(f.sold?' Without the original deed box the case takes years, but the ledger is enough.':' The original deed box seals it.')+'\n\nThe Rowan claim at Dry Creek is confirmed in your family’s name. Tobias plants an apple tree by the mill. Mara says it will never fruit in this soil.\n\nIt does.'
      :'The ledger is real, but you cannot prove how it was kept, or by whom. Marsh pays a fine, loses his commission and sails south. The Land Company renames itself. Some forgeries stand for years.\n\nBut Dry Creek is yours. '+elias;
  }else if(kind==='trade'){
    title='MARSH’S PRICE';
    text='Marsh keeps the ledger. You keep your family. '+(eli?'Elias is alive, and that is a kind of victory.':'Elias is gone, and that is a kind of defeat.')+'\n\nThe steamer berth is exactly as good as promised, and so is the company’s silence. The Land Company prospers. You sleep badly for years.\n\nTwenty years later, Tobias finds a tin deed box in a Portland pawnshop, and brings it home.';
  }else if(kind==='confront'){
    title='A HARD PEACE';
    text='Without the ledger you have only what you know, and Marsh has only what he fears. It turns out to be enough. He leaves Dry Creek at a gallop, and the company’s claim on the mill quietly lapses.\n\nNobody is punished. Nobody is cheated, either, not here. '+elias;
  }else{
    title='QUIET VALLEY';
    text='You take what you can carry and go up the creek, where no one measures anything. Marsh’s company buries Dry Creek in paper within the year. You are long gone.\n\nThe farm is small and the winters are hard. '+(eli?'Elias recovers, slowly, and learns to laugh again.':'Mara plants flowers over a grave beside the mill.')+'\n\nSomeone else will have to answer for the others.';
  }
  const fate=(dead.length?'\n\nLost on the road: '+dead.join(', ')+'.':'\n\nEveryone who left Independence reached the valley.')+(f.wrenGone?' Wren was never seen again.':'');
  const stats='\n\nDays on the road: '+G.day+'.  Survivors: '+al+'/'+G.party.filter(p=>!p.left).length+'.  Clues found: '+G.clues+'.';
  jr('ENDING: '+title);try{localStorage.removeItem('llw1')}catch(e){}
  Q.length=0;mode='end';G.over=true;
  Q.push({title:title,camp:false,text:text+fate+stats,choices:[
    {t:'Read the journal',go:()=>({stop:true,run:()=>{showJournal()}})},
    {t:'Play again',go:()=>({stop:true,run:()=>{renderTitle()}})}]});
}

   {t:'Swap 10 ammo for 80 lb of food',dis:()=>G.ammo<10,why:'not enough ammo',go:()=>({text:'Their hunters are better shots; they are short on lead.',fx:{ammo:-10,food:80}})},
   {t:'Share their fire and move on',go:()=>({text:'A fiddle tune, a pot of coffee, a stranger’s kindness.',fx:{morale:6}})}]}),
 ()=>{const w=member('Wren');return{title:'The Wrong Fork',text:'The road splits, and your guess turns out to be wrong. Half a day of hard walking before you realize it.'+((w&&!w.dead)?'\n\nWren spots the mistake early and turns you back with a word.':''),choices:[{t:'Continue',go:()=>(w&&!w.dead)?{text:'She was right, as she usually is.',fx:{morale:-1}}:{text:'You backtrack, grumbling at the sun.',fx:{days:1,morale:-3}}}]}},
 ()=>({title:'Prairie Fire',text:'Smoke on the horizon, and then a red line moving faster than a horse. Hollis is already yelling.',choices:[
   {t:'Outrun it',go:()=>({text:'Smoke in your lungs, ash in your hair, but you break clear of it.',fx:{hp:-10,food:-20}})},
   {t:'Burn a firebreak (2 days)',go:()=>({text:'You light a backfire and stand in the black. The big fire goes around you like a river around a stone.',fx:{days:2}})}]}),
 ()=>({title:'Cold Snap',text:'Overnight the temperature plunges. Frost etches the canvas from the inside. The oxen stand steaming in the dark.',choices:[
   {t:'Burn extra wood and keep everyone warm',go:()=>({text:'You burn half the spare wood. Everyone sleeps in a pile, like puppies.',fx:{morale:2}})},
   {t:'Make do with blankets',go:()=>({text:'It is a long, shivering night.',fx:{hp:-12}})}]}),
 ()=>{G.f.sHollis=1;return{title:'Hollis Remembers',camp:true,text:'Over the coffee Hollis speaks, unprompted, for the first time in weeks.\n\n“There was a boy named Dunn in the war. Seventeen. I promised his mother I’d bring him home. I brought him home, all right.”\n\nHe looks into the fire for a long while.\n\n“Never make a promise on a road,” he says. “Roads don’t keep them.”',choices:[{t:'Continue',go:()=>({text:'Mara touches the old man’s sleeve. He lets her.',fx:{morale:6}})}]}},
 ()=>{G.f.sMara=1;return{title:'Mara Sings',camp:true,text:'Late at night, Mara hums something old and slow. After a while Tobias joins, off-key. Then Hollis, gruffly, as if he were being forced.\n\nIt is a hymn about a river and a home that is always just ahead.',choices:[{t:'Continue',go:()=>({text:'The oxen shift in the dark. Somewhere out on the plain, a wolf listens.',fx:{morale:8}})}]}}
];
function randomEvent(){
  const b=biome(G.miles);let list=RAND.slice(0,10);
  if(G.miles<530)list.push(RAND[10]);
  if(b.snow)list.push(RAND[11]);
  if(!G.f.sHollis&&member('Hollis')&&!member('Hollis').dead)list.push(RAND[12]);
  if(!G.f.sMara&&member('Mara')&&!member('Mara').dead)list.push(RAND[13]);
  return pick(list)();
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function frame(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;
  try{update(dt);draw()}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
renderTitle();
requestAnimationFrame(frame);
let wl=null;
function keepAwake(){try{if(navigator.wakeLock&&!wl){navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null})}).catch(()=>{})}}catch(e){}}
document.addEventListener('pointerdown',keepAwake);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
